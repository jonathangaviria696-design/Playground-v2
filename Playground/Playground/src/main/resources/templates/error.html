<!--
  error.html — Página de error genérica (404, 500, etc.)
  Modelo opcional: status, error, message. Valores por defecto con operador Elvis (?:).
-->
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playground — Error</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

  <nav class="navbar">
    <h1 class="logo"><span style="color:var(--primary)">PLAY</span>GROUND</h1>
    <ul class="nav-links">
      <li><a th:href="@{/dashboard}">Inicio</a></li>
    </ul>
    <a th:href="@{/login}" class="btn small">Iniciar sesión</a>
  </nav>

  <div class="error-page">
    <!-- Código HTTP: th:text con operador Elvis (?:) y valor por defecto 404 -->
    <div class="error-code" th:text="${status ?: '404'}">404</div>
    <div class="error-badge">Estamos trabajando en ello</div>
    <h2 class="error-title" th:text="${error ?: 'Página no encontrada'}">Algo salió mal</h2>
    <p class="error-desc" th:text="${message ?: 'Esta página no existe o está temporalmente fuera de servicio. Nuestro equipo ya fue notificado y lo resolveremos lo antes posible.'}">
      Esta sección no está disponible por el momento.
    </p>
    <div class="error-actions">
      <a th:href="@{/dashboard}" class="btn">← Volver al inicio</a>
      <a href="javascript:history.back()" class="btn-outline">Página anterior</a>
    </div>
  </div>

  <footer class="footer">
    <p>© 2026 — <span style="color:var(--primary)">PLAYGROUND</span></p>
  </footer>

</body>
</html>
